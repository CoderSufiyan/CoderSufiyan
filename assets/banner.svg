<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb">
        <animate attributeName="stop-color" values="#2563eb;#7c3aed;#2563eb" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#2563eb;#7c3aed" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="respGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.1} }
      @keyframes fadeIn { from{opacity:0} to{opacity:1} }
      @keyframes pulse { 0%,100%{opacity:0.04} 50%{opacity:0.08} }
      .bl { animation: blink 1s infinite; }
      .fi { animation: fadeIn 0.4s both ease-out; }
      .pu { animation: pulse 3s ease-in-out infinite; }
    </style>

    <clipPath id="cr0"><rect x="0" y="0" width="0" height="30"><animate attributeName="width" from="0" to="110" dur="0.4s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="cr1"><rect x="0" y="0" width="0" height="30"><animate attributeName="width" from="0" to="160" dur="0.5s" begin="1.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="cr2"><rect x="0" y="0" width="0" height="30"><animate attributeName="width" from="0" to="140" dur="0.4s" begin="2.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="cr3"><rect x="0" y="0" width="0" height="30"><animate attributeName="width" from="0" to="440" dur="0.7s" begin="2.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="cr4"><rect x="0" y="0" width="0" height="30"><animate attributeName="width" from="0" to="250" dur="0.5s" begin="3.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="cr5"><rect x="0" y="0" width="0" height="30"><animate attributeName="width" from="0" to="380" dur="0.7s" begin="4.6s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>

  <!-- background code fragments -->
  <g font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#2563eb" opacity="0.04">
    <text x="30"  y="40">  function handler(req) { return await db.query(req.params); }</text>
    <text x="420" y="70">  const pipeline = compose(validate, transform, respond);</text>
    <text x="150" y="280">  export async function migrate(state: MigrationState)</text>
    <text x="550" y="255">  defer cleanup(); if err != nil { log.Fatal(err) }</text>
    <text x="60"  y="150">  type Config struct { Timeout time.Duration `json:"timeout"` }</text>
    <text x="680" y="50">  @retry(max_attempts=3, backoff=exponential)</text>
    <text x="780" y="130">  interface CircuitBreaker { state: 'open' | 'half' | 'closed' }</text>
  </g>

  <g font-family="'SF Mono',monospace" font-size="48" fill="#2563eb" class="pu" opacity="0.03">
    <text x="32"  y="210" style="animation-delay:0s">{</text>
    <text x="920" y="160" style="animation-delay:1s">}</text>
    <text x="60"  y="260" style="animation-delay:1.5s">(</text>
  </g>

  <!-- terminal window -->
  <rect x="55" y="22" width="890" height="256" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="55" y="22" width="890" height="32" rx="8" fill="#f6f8fa"/>
  <rect x="55" y="38" width="890" height="16" fill="#f6f8fa"/>
  <circle cx="74" cy="38" r="6" fill="#ff5f56"/>
  <circle cx="94" cy="38" r="6" fill="#ffbd2e"/>
  <circle cx="114" cy="38" r="6" fill="#27c93f"/>
  <text x="500" y="43" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" fill="#656d76" font-weight="500">sufiyan-khan — zsh</text>

  <line x1="55" y1="54" x2="945" y2="54" stroke="#d0d7de" stroke-width="1"/>

  <g font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="15">

    <text x="90" y="82" fill="#1a7f37" clip-path="url(#cr0)">~ $ whoami</text>
    <text x="110" y="110" fill="url(#respGrad)" font-weight="700" clip-path="url(#cr1)" filter="url(#glow)">sufiya-khan</text>

    <text x="90" y="140" fill="#1a7f37" clip-path="url(#cr2)">~ $ cat ROLE</text>
    <text x="110" y="168" fill="#24292f" clip-path="url(#cr3)">Senior Software Engineer · Backend · AI Infrastructure</text>

    <text x="90" y="198" fill="#1a7f37" clip-path="url(#cr4)">~ $ open-source --active</text>
    <text x="110" y="226" fill="#24292f" clip-path="url(#cr5)">
      <tspan fill="#24292f">netbird </tspan><tspan fill="#2563eb">27K+★</tspan><tspan fill="#24292f"> · cline </tspan><tspan fill="#2563eb">64K+★</tspan>
    </text>

    <rect x="474" y="212" width="2.5" height="17" rx="1" fill="#2563eb" class="bl" filter="url(#glow)"/>

  </g>

  <text x="90" y="263" font-family="'SF Mono',monospace" font-size="15" fill="#1a7f37" opacity="0" class="fi" style="animation-delay:5.8s">~ $ █</text>

  <rect x="55" y="22" width="890" height="256" rx="8" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.2"/>
</svg>
