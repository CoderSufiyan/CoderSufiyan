<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>

    <linearGradient id="sh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#818cf8;#3b82f6" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#3b82f6;#818cf8" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="gh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>

    <filter id="g">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      @keyframes in { from{opacity:0} to{opacity:1} }
      @keyframes slide { from{transform:translateX(-20px);opacity:0} to{transform:translateX(0);opacity:1} }
      @keyframes pulse { 0%,100%{opacity:0.06} 50%{opacity:0.14} }
      @keyframes draw { to{stroke-dashoffset:0} }
      .i { animation:in .05s both ease-out }
      .s { animation:slide .5s both ease-out }
      .p { animation:pulse 2.5s ease-in-out infinite }
      .d { animation:draw 1s both ease-out }
      .m { font-family:'SF Mono','Fira Code','Cascadia Code',monospace }
      .t { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif }
    </style>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- side gutter (like diff line numbers) -->
  <rect x="0" y="0" width="62" height="260" fill="#0d1117"/>
  <line x1="62" y1="0" x2="62" y2="260" stroke="#21262d" stroke-width="1"/>

  <!-- line numbers -->
  <g class="m" font-size="11" fill="#484f58">
    <text x="52" y="54" text-anchor="end">1</text>
    <text x="52" y="74" text-anchor="end">2</text>
    <text x="52" y="94" text-anchor="end">3</text>
    <text x="52" y="126" text-anchor="end">4</text>
    <text x="52" y="146" text-anchor="end">5</text>
    <text x="52" y="166" text-anchor="end">6</text>
    <text x="52" y="186" text-anchor="end">7</text>
    <text x="52" y="220" text-anchor="end">8</text>
    <text x="52" y="240" text-anchor="end">9</text>
  </g>

  <!-- + signs (green additions) -->
  <g class="m" font-size="13" fill="#3fb950">
    <text x="70" y="54" class="i" style="animation-delay:.2s">+</text>
    <text x="70" y="74" class="i" style="animation-delay:.3s">+</text>
    <text x="70" y="94" class="i" style="animation-delay:.4s">+</text>
    <text x="70" y="126" class="i" style="animation-delay:.5s">+</text>
    <text x="70" y="146" class="i" style="animation-delay:.6s">+</text>
    <text x="70" y="166" class="i" style="animation-delay:.7s">+</text>
    <text x="70" y="186" class="i" style="animation-delay:.8s">+</text>
    <text x="70" y="220" class="i" style="animation-delay:.9s">+</text>
    <text x="70" y="240" class="i" style="animation-delay:1s">+</text>
  </g>

  <!-- green highlight bars -->
  <rect x="62" y="45" width="938" height="55" fill="#1a2332" opacity="0.8" class="s" style="animation-delay:.3s"/>

  <!-- content lines -->
  <g class="m">

    <!-- line 1: name -->
    <text x="90" y="54" font-size="16" font-weight="700" fill="#f0f2f5" filter="url(#g)">
      <tspan class="i" style="animation-delay:.15s">S</tspan><tspan class="i" style="animation-delay:.17s">u</tspan><tspan class="i" style="animation-delay:.19s">f</tspan><tspan class="i" style="animation-delay:.21s">i</tspan><tspan class="i" style="animation-delay:.23s">y</tspan><tspan class="i" style="animation-delay:.25s">a</tspan><tspan class="i" style="animation-delay:.27s">n</tspan>
      <tspan class="i" style="animation-delay:.33s" fill="#58a6ff"> </tspan>
      <tspan class="i" style="animation-delay:.35s" fill="url(#sh)">K</tspan><tspan class="i" style="animation-delay:.37s" fill="url(#sh)">h</tspan><tspan class="i" style="animation-delay:.39s" fill="url(#sh)">a</tspan><tspan class="i" style="animation-delay:.41s" fill="url(#sh)">n</tspan>
    </text>

    <!-- line 2: role -->
    <text x="90" y="74" font-size="14" fill="#8b949e" class="s" style="animation-delay:.5s">
      Senior Software Engineer
    </text>

    <!-- line 3: focus -->
    <text x="90" y="93" font-size="13" fill="#484f58" class="s" style="animation-delay:.65s">
      Backend · AI Infrastructure · Distributed Systems
    </text>

    <!-- spacer line -->
    <line x1="90" y1="104" x2="940" y2="104" stroke="#21262d" stroke-width="0.5" class="d" stroke-dasharray="850" style="stroke-dashoffset:850"/>

    <!-- line 4: netbird -->
    <text x="90" y="126" font-size="14" fill="#f0f2f5" class="s" style="animation-delay:.8s">
      <tspan>Contributes to </tspan>
      <tspan fill="#58a6ff" font-weight="700">netbird</tspan>
      <tspan fill="#8b949e"> — WireGuard overlay network (</tspan>
      <tspan fill="url(#sh)" font-weight="700">27K</tspan>
      <tspan fill="#f0f2f5">&#9733;</tspan>
      <tspan fill="#8b949e">)</tspan>
    </text>

    <!-- line 5: cline -->
    <text x="90" y="146" font-size="14" fill="#f0f2f5" class="s" style="animation-delay:.95s">
      <tspan>Contributes to </tspan>
      <tspan fill="#58a6ff" font-weight="700">cline</tspan>
      <tspan fill="#8b949e"> — AI coding agent (</tspan>
      <tspan fill="url(#sh)" font-weight="700">64K</tspan>
      <tspan fill="#f0f2f5">&#9733;</tspan>
      <tspan fill="#8b949e">)</tspan>
    </text>

    <!-- line 6: packages -->
    <text x="90" y="166" font-size="13" fill="#484f58" class="s" style="animation-delay:1.1s">
      Authored 5 OSS packages — npm &amp; PyPI
    </text>

    <line x1="90" y1="176" x2="940" y2="176" stroke="#21262d" stroke-width="0.5" class="d" stroke-dasharray="850" style="stroke-dashoffset:850;animation-delay:.6s"/>

    <!-- line 7: metrics -->
    <text x="90" y="198" font-size="14" fill="#8b949e" class="s" style="animation-delay:1.3s">
      <tspan fill="#58a6ff" font-weight="700">1M+</tspan><tspan> req/min</tspan>
      <tspan fill="#484f58"> · </tspan>
      <tspan fill="#58a6ff" font-weight="700">70K+</tspan><tspan> users migrated</tspan>
      <tspan fill="#484f58"> · </tspan>
      <tspan fill="#58a6ff" font-weight="700">92%</tspan><tspan> faster reviews</tspan>
    </text>

    <!-- line 8: availability -->
    <text x="90" y="220" font-size="13" fill="#3fb950" class="s" style="animation-delay:1.5s">
      &#9679; Open to work — Full-time · Contract · Remote worldwide
    </text>

    <!-- line 9: email -->
    <text x="90" y="239" font-size="13" fill="#484f58" class="s" style="animation-delay:1.65s">
      sufiyanandkhan@gmail.com
    </text>
  </g>

  <!-- floating accent elements -->
  <g fill="#3b82f6" class="p">
    <circle cx="785" cy="55" r="2" style="animation-delay:0s"/>
    <circle cx="920" cy="128" r="1.5" style="animation-delay:.5s"/>
    <circle cx="810" cy="200" r="1.8" style="animation-delay:1s"/>
  </g>

  <!-- bottom accent line -->
  <rect x="0" y="257" width="1000" height="3" fill="url(#sh)" opacity="0.3"/>

</svg>
