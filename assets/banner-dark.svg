<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#8b5cf6;#3b82f6" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#3b82f6;#8b5cf6" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="respGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0,0,0,0.12)"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.1} }
      @keyframes fadeIn { from{opacity:0} to{opacity:1} }
      @keyframes pulse { 0%,100%{opacity:0.04} 50%{opacity:0.1} }
      .bl { animation: blink 1s infinite; }
      .fi { animation: fadeIn 0.4s both ease-out; }
      .pu { animation: pulse 3s ease-in-out infinite; }
    </style>

    <!-- clip paths for typing effect -->
    <clipPath id="cr0"><rect x="0" y="0" width="0" height="30"><animate attributeName="width" from="0" to="110" dur="0.4s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="cr1"><rect x="0" y="0" width="0" height="30"><animate attributeName="width" from="0" to="160" dur="0.5s" begin="1.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="cr2"><rect x="0" y="0" width="0" height="30"><animate attributeName="width" from="0" to="140" dur="0.4s" begin="2.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="cr3"><rect x="0" y="0" width="0" height="30"><animate attributeName="width" from="0" to="440" dur="0.7s" begin="2.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="cr4"><rect x="0" y="0" width="0" height="30"><animate attributeName="width" from="0" to="250" dur="0.5s" begin="3.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="cr5"><rect x="0" y="0" width="0" height="30"><animate attributeName="width" from="0" to="380" dur="0.7s" begin="4.6s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>

  <!-- code rain background -->
  <g font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="11" fill="#3b82f6" opacity="0.06">
    <text x="30"  y="40">  function handler(req) { return await db.query(req.params); }</text>
    <text x="420" y="70">  const pipeline = compose(validate, transform, respond);</text>
    <text x="150" y="280">  export async function migrate(state: MigrationState)</text>
    <text x="550" y="255">  defer cleanup(); if err != nil { log.Fatal(err) }</text>
    <text x="60"  y="150">  type Config struct { Timeout time.Duration `json:"timeout"` }</text>
    <text x="680" y="50">  @retry(max_attempts=3, backoff=exponential)</text>
    <text x="780" y="130">  interface CircuitBreaker { state: 'open' | 'half' | 'closed' }</text>
  </g>

  <!-- floating braces -->
  <g font-family="'SF Mono',monospace" font-size="48" fill="#3b82f6" class="pu" opacity="0.04">
    <text x="32"  y="210" style="animation-delay:0s">{</text>
    <text x="920" y="160" style="animation-delay:1s">}</text>
    <text x="60"  y="260" style="animation-delay:1.5s">(</text>
  </g>

  <!-- terminal window -->
  <rect x="55" y="22" width="890" height="256" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="55" y="22" width="890" height="256" rx="8" fill="url(#scanlines)" pointer-events="none"/>

  <!-- title bar -->
  <rect x="55" y="22" width="890" height="32" rx="8" fill="#21262d"/>
  <rect x="55" y="38" width="890" height="16" fill="#21262d"/>
  <circle cx="74" cy="38" r="6" fill="#ff5f56"/>
  <circle cx="94" cy="38" r="6" fill="#ffbd2e"/>
  <circle cx="114" cy="38" r="6" fill="#27c93f"/>
  <text x="500" y="43" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" fill="#8b949e" font-weight="500">sufiyan-khan — zsh</text>

  <!-- terminal body padding line -->
  <line x1="55" y1="54" x2="945" y2="54" stroke="#21262d" stroke-width="1"/>

  <!-- command lines — monospace, x=90 -->
  <g font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="15">

    <!-- ~ $ whoami -->
    <text x="90" y="82" fill="#7ee787" clip-path="url(#cr0)">~ $ whoami</text>
    <!-- response: sufiya-khan -->
    <text x="110" y="110" fill="url(#respGrad)" font-weight="700" clip-path="url(#cr1)" filter="url(#glow)">sufiya-khan</text>

    <!-- ~ $ cat ROLE -->
    <text x="90" y="140" fill="#7ee787" clip-path="url(#cr2)">~ $ cat ROLE</text>
    <!-- response -->
    <text x="110" y="168" fill="#e6edf3" clip-path="url(#cr3)">Senior Software Engineer · Backend · AI Infrastructure</text>

    <!-- ~ $ open-source --active -->
    <text x="90" y="198" fill="#7ee787" clip-path="url(#cr4)">~ $ open-source --active</text>
    <!-- response with colored highlights -->
    <text x="110" y="226" fill="#e6edf3" clip-path="url(#cr5)">
      <tspan fill="#e6edf3">netbird </tspan><tspan fill="#58a6ff">27K+★</tspan><tspan fill="#e6edf3"> · cline </tspan><tspan fill="#58a6ff">64K+★</tspan>
    </text>

    <!-- cursor -->
    <rect x="474" y="212" width="2.5" height="17" rx="1" fill="#58a6ff" class="bl" filter="url(#glow)"/>

  </g>

  <!-- bottom prompt line -->
  <rect x="90" y="248" width="10" height="17" fill="none"/>
  <text x="90" y="263" font-family="'SF Mono',monospace" font-size="15" fill="#7ee787" opacity="0" class="fi" style="animation-delay:5.8s">~ $ █</text>

  <!-- corner glow -->
  <rect x="55" y="22" width="890" height="256" rx="8" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.25"/>
</svg>
