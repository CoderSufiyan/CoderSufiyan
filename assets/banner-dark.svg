<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#8b5cf6;#3b82f6" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#3b82f6;#8b5cf6" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0,0,0,0.1)"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      @keyframes pop { from{opacity:0;filter:blur(1px)} to{opacity:1;filter:blur(0)} }
      @keyframes fadeUp { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.08} }
      @keyframes pulse { 0%,100%{opacity:0.03} 50%{opacity:0.08} }
      @keyframes glitch { 0%,100%{transform:translateX(0)} 2%{transform:translateX(-1px)} 4%{transform:translateX(1px)} 6%{transform:translateX(0)} }
      .p  { animation: pop 0.04s both ease-out; }
      .fu { animation: fadeUp 0.5s both ease-out; }
      .bl { animation: blink 0.9s infinite; }
      .bp { animation: pulse 4s ease-in-out infinite; }
      .gl { animation: glitch 6s infinite; }
      .mn { font-family: 'SF Mono','Fira Code','Cascadia Code',monospace; font-size:15px; }
      .sf { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    </style>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>

  <!-- code rain background -->
  <g font-family="'SF Mono',monospace" font-size="11" fill="#3b82f6" class="bp">
    <text x="30"  y="40"  style="animation-delay:0s">  func handler(req) { return db.query(req.params) }</text>
    <text x="440" y="70"  style="animation-delay:0.5s">  const pipeline = compose(validate, process, respond)</text>
    <text x="160" y="280" style="animation-delay:1s">  export async function migrate(state: Config): void</text>
    <text x="560" y="260" style="animation-delay:1.5s">  defer cleanup(); if err != nil { log.Fatal(err) }</text>
    <text x="50"  y="150" style="animation-delay:2s">  type Config struct { Timeout time.Duration `json:"timeout"` }</text>
    <text x="680" y="45"  style="animation-delay:2.5s">  @retry(max=3, backoff=exponential, jitter=true)</text>
  </g>

  <!-- floating braces -->
  <g font-family="'SF Mono',monospace" font-size="52" fill="#3b82f6" class="bp">
    <text x="28"  y="215" style="animation-delay:0s">{</text>
    <text x="928" y="165" style="animation-delay:1.2s">}</text>
    <text x="56"  y="270" style="animation-delay:2.4s">(</text>
    <text x="900" y="100" style="animation-delay:0.6s">&gt;</text>
  </g>

  <!-- terminal window -->
  <rect x="55" y="22" width="890" height="256" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="55" y="22" width="890" height="256" rx="8" fill="url(#scanlines)" pointer-events="none"/>

  <!-- title bar -->
  <rect x="55" y="22" width="890" height="32" rx="8" fill="#21262d"/>
  <rect x="55" y="38" width="890" height="16" fill="#21262d"/>
  <circle cx="74" cy="38" r="6" fill="#ff5f56"/>
  <circle cx="94" cy="38" r="6" fill="#ffbd2e"/>
  <circle cx="114" cy="38" r="6" fill="#27c93f"/>
  <text x="500" y="43" text-anchor="middle" class="sf" font-size="12" fill="#8b949e" font-weight="500">sufiyan-khan — zsh</text>
  <line x1="55" y1="54" x2="945" y2="54" stroke="#21262d" stroke-width="1"/>

  <g class="mn">

    <!-- ~ $ whoami — typed char by char -->
    <text x="90" y="82" fill="#7ee787">
      <tspan class="p" style="animation-delay:0.20s">~</tspan>
      <tspan class="p" style="animation-delay:0.24s"> </tspan>
      <tspan class="p" style="animation-delay:0.28s">$</tspan>
      <tspan class="p" style="animation-delay:0.32s"> </tspan>
      <tspan class="p" style="animation-delay:0.36s">w</tspan>
      <tspan class="p" style="animation-delay:0.40s">h</tspan>
      <tspan class="p" style="animation-delay:0.44s">o</tspan>
      <tspan class="p" style="animation-delay:0.48s">a</tspan>
      <tspan class="p" style="animation-delay:0.52s">m</tspan>
      <tspan class="p" style="animation-delay:0.56s">i</tspan>
    </text>

    <!-- sufiya-khan — typed char by char (gradient) -->
    <text x="110" y="110" fill="url(#nameGrad)" font-weight="700" filter="url(#glow)">
      <tspan class="p" style="animation-delay:1.00s">s</tspan>
      <tspan class="p" style="animation-delay:1.04s">u</tspan>
      <tspan class="p" style="animation-delay:1.08s">f</tspan>
      <tspan class="p" style="animation-delay:1.12s">i</tspan>
      <tspan class="p" style="animation-delay:1.16s">y</tspan>
      <tspan class="p" style="animation-delay:1.20s">a</tspan>
      <tspan class="p" style="animation-delay:1.24s">n</tspan>
      <tspan class="p" style="animation-delay:1.28s">-</tspan>
      <tspan class="p" style="animation-delay:1.32s">k</tspan>
      <tspan class="p" style="animation-delay:1.36s">h</tspan>
      <tspan class="p" style="animation-delay:1.40s">a</tspan>
      <tspan class="p" style="animation-delay:1.44s">n</tspan>
    </text>

    <!-- ~ $ cat ROLE — typed char by char -->
    <text x="90" y="140" fill="#7ee787">
      <tspan class="p" style="animation-delay:1.90s">~</tspan>
      <tspan class="p" style="animation-delay:1.94s"> </tspan>
      <tspan class="p" style="animation-delay:1.98s">$</tspan>
      <tspan class="p" style="animation-delay:2.02s"> </tspan>
      <tspan class="p" style="animation-delay:2.06s">c</tspan>
      <tspan class="p" style="animation-delay:2.10s">a</tspan>
      <tspan class="p" style="animation-delay:2.14s">t</tspan>
      <tspan class="p" style="animation-delay:2.18s"> </tspan>
      <tspan class="p" style="animation-delay:2.22s">R</tspan>
      <tspan class="p" style="animation-delay:2.26s">O</tspan>
      <tspan class="p" style="animation-delay:2.30s">L</tspan>
      <tspan class="p" style="animation-delay:2.34s">E</tspan>
    </text>

    <!-- response: fade up -->
    <text x="110" y="168" fill="#e6edf3" class="fu" style="animation-delay:2.70s">
      Senior Software Engineer · Backend · AI Infrastructure
    </text>

    <!-- open-source command - typed char by char -->
    <text x="90" y="198" fill="#7ee787">
      <tspan class="p" style="animation-delay:3.30s">~</tspan>
      <tspan class="p" style="animation-delay:3.34s"> </tspan>
      <tspan class="p" style="animation-delay:3.38s">$</tspan>
      <tspan class="p" style="animation-delay:3.42s"> </tspan>
      <tspan class="p" style="animation-delay:3.46s">o</tspan>
      <tspan class="p" style="animation-delay:3.50s">p</tspan>
      <tspan class="p" style="animation-delay:3.54s">e</tspan>
      <tspan class="p" style="animation-delay:3.58s">n</tspan>
      <tspan class="p" style="animation-delay:3.62s">-</tspan>
      <tspan class="p" style="animation-delay:3.66s">s</tspan>
      <tspan class="p" style="animation-delay:3.70s">o</tspan>
      <tspan class="p" style="animation-delay:3.74s">u</tspan>
      <tspan class="p" style="animation-delay:3.78s">r</tspan>
      <tspan class="p" style="animation-delay:3.82s">c</tspan>
      <tspan class="p" style="animation-delay:3.86s">e</tspan>
      <tspan class="p" style="animation-delay:3.90s"> </tspan>
      <tspan class="p" style="animation-delay:3.94s">-</tspan>
      <tspan class="p" style="animation-delay:3.98s">-</tspan>
      <tspan class="p" style="animation-delay:4.02s">a</tspan>
      <tspan class="p" style="animation-delay:4.06s">c</tspan>
      <tspan class="p" style="animation-delay:4.10s">t</tspan>
      <tspan class="p" style="animation-delay:4.14s">i</tspan>
      <tspan class="p" style="animation-delay:4.18s">v</tspan>
      <tspan class="p" style="animation-delay:4.22s">e</tspan>
    </text>

    <!-- response: fade up with highlights -->
    <text x="110" y="226" fill="#e6edf3" class="fu" style="animation-delay:4.60s">
      <tspan fill="#e6edf3">netbird </tspan><tspan fill="#58a6ff">27K+★</tspan><tspan fill="#e6edf3"> · cline </tspan><tspan fill="#58a6ff">64K+★</tspan>
    </text>

    <!-- blinking cursor at end of last line -->
    <rect x="474" y="212" width="2.5" height="17" rx="1.5" fill="#58a6ff" class="bl" filter="url(#glow)"/>

  </g>

  <!-- corner accent glow -->
  <rect x="55" y="22" width="890" height="256" rx="8" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.2"/>
</svg>
