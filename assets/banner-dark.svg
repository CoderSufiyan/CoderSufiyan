<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#8b5cf6;#ec4899;#3b82f6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#ec4899;#3b82f6;#8b5cf6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%;-100%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%;0%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <style>
      @keyframes charIn {
        from { opacity: 0; filter: blur(1px); }
        to   { opacity: 1; filter: blur(0); }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.15; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-5px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: 0; }
      }
      @keyframes fadePulse {
        0%, 100% { opacity: 0.06; }
        50%      { opacity: 0.15; }
      }

      .c  { animation: charIn 0.05s both ease-out; }
      .fu { animation: fadeUp 0.6s 2.2s both ease-out; }
      .fu2{ animation: fadeUp 0.6s 2.6s both ease-out; }
      .bl { animation: blink 0.9s infinite; }
      .fl { animation: float 4s ease-in-out infinite; }
      .fp { animation: fadePulse 5s ease-in-out infinite; }

      .line {
        stroke: url(#shimmer);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 300;
        stroke-dashoffset: 300;
        animation: dash 0.8s 1.5s both ease-out;
      }
    </style>
  </defs>

  <!-- background -->
  <rect width="1000" height="300" fill="url(#bg)"/>

  <!-- top / bottom accent bars -->
  <rect x="0" y="0"   width="1000" height="3" fill="url(#shimmer)"/>
  <rect x="0" y="297" width="1000" height="3" fill="url(#shimmer)" opacity="0.4"/>

  <!-- glow pass -->
  <rect x="0" y="0" width="1000" height="300" fill="url(#glow)"/>

  <!-- floating blobs -->
  <circle cx="120" cy="240" r="80" fill="#3b82f6" opacity="0.03" class="fl" style="animation-delay:0s"/>
  <circle cx="880" cy="70"  r="100" fill="#8b5cf6" opacity="0.03" class="fl" style="animation-delay:1.3s"/>
  <circle cx="780" cy="270" r="60"  fill="#ec4899" opacity="0.03" class="fl" style="animation-delay:2.6s"/>

  <!-- dot grid -->
  <g fill="#3b82f6" class="fp">
    <circle cx="50"  cy="60"  r="1.2"/>
    <circle cx="150" cy="280" r="1"  />
    <circle cx="300" cy="40"  r="1.2"/>
    <circle cx="680" cy="260" r="1.2"/>
    <circle cx="920" cy="50"  r="1"  />
    <circle cx="940" cy="240" r="1.2"/>
    <circle cx="70"  cy="180" r="1"  />
    <circle cx="580" cy="30"  r="1.2"/>
  </g>

  <!-- NAME – character by character -->
  <text x="500" y="108" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="62" font-weight="900" fill="#e6edf3" letter-spacing="2">
    <tspan class="c" style="animation-delay:0.10s">S</tspan>
    <tspan class="c" style="animation-delay:0.16s">u</tspan>
    <tspan class="c" style="animation-delay:0.22s">f</tspan>
    <tspan class="c" style="animation-delay:0.28s">i</tspan>
    <tspan class="c" style="animation-delay:0.34s">y</tspan>
    <tspan class="c" style="animation-delay:0.40s">a</tspan>
    <tspan class="c" style="animation-delay:0.46s">n</tspan>
    <tspan class="c" style="animation-delay:0.56s" fill="#e6edf3"> </tspan>
    <tspan class="c" style="animation-delay:0.62s" fill="url(#shimmer)">K</tspan>
    <tspan class="c" style="animation-delay:0.68s" fill="url(#shimmer)">h</tspan>
    <tspan class="c" style="animation-delay:0.74s" fill="url(#shimmer)">a</tspan>
    <tspan class="c" style="animation-delay:0.80s" fill="url(#shimmer)">n</tspan>
  </text>

  <!-- cursor -->
  <rect x="676" y="60" width="3" height="52" rx="1.5" fill="#3b82f6" class="bl"/>

  <!-- underline bar -->
  <line x1="350" y1="148" x2="650" y2="148" class="line"/>

  <!-- ROLE -->
  <text x="500" y="180" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#8b949e" class="fu">
    Senior Software Engineer
  </text>

  <!-- SUBTITLE -->
  <text x="500" y="214" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#484f58" class="fu2">
    Backend &amp; AI Infrastructure · Open Source · 4+ Years
  </text>
</svg>
