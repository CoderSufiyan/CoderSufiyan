<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260">

  <defs>
    <pattern id="s" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0,0,0,0.35)"/>
    </pattern>

    <filter id="g">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      @keyframes p { from{opacity:0;filter:blur(1px)} to{opacity:1;filter:blur(0)} }
      @keyframes b { 0%,100%{opacity:1} 48%{opacity:1} 52%{opacity:0.05} }
      @keyframes g { 0%,100%{transform:translate(0)} 2.5%{transform:translate(-2px,1px)} 5%{transform:translate(1px)} 7.5%{transform:translate(0)} }
      .c { animation: p .04s both ease-out; }
      .B { animation: b .9s infinite; }
      .G { animation: g 5s infinite; }
      .f { font-family:'SF Mono','Fira Code','Cascadia Code',monospace; font-size:18px; }
    </style>
  </defs>

  <rect width="1000" height="260" fill="#000"/>

  <!-- bg hex -->
  <g font-family="'SF Mono',monospace" font-size="11" fill="#00ff41" opacity=".07">
    <text x="20"  y="35">0x7f push eax | xor edx,edx | call 0x401000</text>
    <text x="380" y="65">struct sockaddr { sin_family=AF_INET port=htons(443) }</text>
    <text x="80"  y="245">nmap -sV -p- --script=vuln 10.0.1.0/24</text>
    <text x="520" y="235">tcpdump -i eth0 -A 'tcp port 443' | grep GET</text>
    <text x="620" y="42">ssh -D 1080 -C -N -f user@jumpbox</text>
    <text x="60"  y="130">type Config struct { Timeout time.Duration }</text>
  </g>

  <!-- symbols -->
  <g font-family="'SF Mono',monospace" font-size="48" fill="#00ff41" opacity=".08">
    <text x="28" y="200">{</text>
    <text x="920" y="155">}</text>
    <text x="900" y="90">&gt;</text>
  </g>

  <!-- terminal -->
  <rect x="40" y="15" width="920" height="230" rx="6" fill="#000a00" stroke="#00cc33" stroke-width="1.5"/>
  <rect x="40" y="15" width="920" height="230" rx="6" fill="url(#s)"/>

  <!-- titlebar -->
  <rect x="40" y="15" width="920" height="28" rx="6" fill="#001a00"/>
  <rect x="40" y="30" width="920" height="13" fill="#001a00"/>
  <circle cx="58" cy="29" r="5" fill="#f33"/>
  <circle cx="75" cy="29" r="5" fill="#fc0"/>
  <circle cx="92" cy="29" r="5" fill="#0f0"/>
  <text x="500" y="34" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0c0" font-weight="600">root@kali:~# ./connect</text>
  <line x1="40" y1="43" x2="960" y2="43" stroke="#030" stroke-width="1"/>

  <g class="f">

    <!-- $ whoami -->
    <text x="80" y="70" fill="#0f0" filter="url(#g)">
      <tspan class="c" style="animation-delay:.2s">$</tspan>
      <tspan class="c" style="animation-delay:.24s"> </tspan>
      <tspan class="c" style="animation-delay:.28s">w</tspan>
      <tspan class="c" style="animation-delay:.32s">h</tspan>
      <tspan class="c" style="animation-delay:.36s">o</tspan>
      <tspan class="c" style="animation-delay:.4s">a</tspan>
      <tspan class="c" style="animation-delay:.44s">m</tspan>
      <tspan class="c" style="animation-delay:.48s">i</tspan>
    </text>

    <!-- name -->
    <text x="100" y="98" fill="#0f0" font-weight="700" filter="url(#g)" class="G">
      <tspan class="c" style="animation-delay:1s">s</tspan>
      <tspan class="c" style="animation-delay:1.04s">u</tspan>
      <tspan class="c" style="animation-delay:1.08s">f</tspan>
      <tspan class="c" style="animation-delay:1.12s">i</tspan>
      <tspan class="c" style="animation-delay:1.16s">y</tspan>
      <tspan class="c" style="animation-delay:1.2s">a</tspan>
      <tspan class="c" style="animation-delay:1.24s">n</tspan>
      <tspan class="c" style="animation-delay:1.28s" fill="#ff0">-</tspan>
      <tspan class="c" style="animation-delay:1.32s" fill="#ff0">k</tspan>
      <tspan class="c" style="animation-delay:1.36s" fill="#ff0">h</tspan>
      <tspan class="c" style="animation-delay:1.4s" fill="#ff0">a</tspan>
      <tspan class="c" style="animation-delay:1.44s" fill="#ff0">n</tspan>
    </text>

    <!-- $ cat ROLE -->
    <text x="80" y="127" fill="#0f0" filter="url(#g)">
      <tspan class="c" style="animation-delay:1.9s">$</tspan>
      <tspan class="c" style="animation-delay:1.94s"> </tspan>
      <tspan class="c" style="animation-delay:1.98s">c</tspan>
      <tspan class="c" style="animation-delay:2.02s">a</tspan>
      <tspan class="c" style="animation-delay:2.06s">t</tspan>
      <tspan class="c" style="animation-delay:2.1s"> </tspan>
      <tspan class="c" style="animation-delay:2.14s">R</tspan>
      <tspan class="c" style="animation-delay:2.18s">O</tspan>
      <tspan class="c" style="animation-delay:2.22s">L</tspan>
      <tspan class="c" style="animation-delay:2.26s">E</tspan>
    </text>

    <!-- role -->
    <text x="100" y="153" fill="#0f0" font-weight="600" filter="url(#g)">
      <tspan class="c" style="animation-delay:2.6s">S</tspan>
      <tspan class="c" style="animation-delay:2.64s">e</tspan>
      <tspan class="c" style="animation-delay:2.68s">n</tspan>
      <tspan class="c" style="animation-delay:2.72s">i</tspan>
      <tspan class="c" style="animation-delay:2.76s">o</tspan>
      <tspan class="c" style="animation-delay:2.8s">r</tspan>
      <tspan class="c" style="animation-delay:2.84s"> </tspan>
      <tspan class="c" style="animation-delay:2.88s">S</tspan>
      <tspan class="c" style="animation-delay:2.92s">o</tspan>
      <tspan class="c" style="animation-delay:2.96s">f</tspan>
      <tspan class="c" style="animation-delay:3s">t</tspan>
      <tspan class="c" style="animation-delay:3.04s">w</tspan>
      <tspan class="c" style="animation-delay:3.08s">a</tspan>
      <tspan class="c" style="animation-delay:3.12s">r</tspan>
      <tspan class="c" style="animation-delay:3.16s">e</tspan>
      <tspan class="c" style="animation-delay:3.2s"> </tspan>
      <tspan class="c" style="animation-delay:3.24s">E</tspan>
      <tspan class="c" style="animation-delay:3.28s">n</tspan>
      <tspan class="c" style="animation-delay:3.32s">g</tspan>
      <tspan class="c" style="animation-delay:3.36s">i</tspan>
      <tspan class="c" style="animation-delay:3.4s">n</tspan>
      <tspan class="c" style="animation-delay:3.44s">e</tspan>
      <tspan class="c" style="animation-delay:3.48s">e</tspan>
      <tspan class="c" style="animation-delay:3.52s">r</tspan>
      <tspan class="c" style="animation-delay:3.56s" fill="#555">·</tspan>
      <tspan class="c" style="animation-delay:3.6s" fill="#555"> </tspan>
      <tspan class="c" style="animation-delay:3.64s" fill="#555">B</tspan>
      <tspan class="c" style="animation-delay:3.68s" fill="#555">a</tspan>
      <tspan class="c" style="animation-delay:3.72s" fill="#555">c</tspan>
      <tspan class="c" style="animation-delay:3.76s" fill="#555">k</tspan>
      <tspan class="c" style="animation-delay:3.8s" fill="#555">e</tspan>
      <tspan class="c" style="animation-delay:3.84s" fill="#555">n</tspan>
      <tspan class="c" style="animation-delay:3.88s" fill="#555">d</tspan>
      <tspan class="c" style="animation-delay:3.92s" fill="#555"> </tspan>
      <tspan class="c" style="animation-delay:3.96s" fill="#555">·</tspan>
      <tspan class="c" style="animation-delay:4s" fill="#555"> </tspan>
      <tspan class="c" style="animation-delay:4.04s" fill="#555">A</tspan>
      <tspan class="c" style="animation-delay:4.08s" fill="#555">I</tspan>
      <tspan class="c" style="animation-delay:4.12s" fill="#555"> </tspan>
      <tspan class="c" style="animation-delay:4.16s" fill="#555">I</tspan>
      <tspan class="c" style="animation-delay:4.2s" fill="#555">n</tspan>
      <tspan class="c" style="animation-delay:4.24s" fill="#555">f</tspan>
      <tspan class="c" style="animation-delay:4.28s" fill="#555">r</tspan>
      <tspan class="c" style="animation-delay:4.32s" fill="#555">a</tspan>
    </text>

    <!-- $ open-source -->
    <text x="80" y="182" fill="#0f0" filter="url(#g)">
      <tspan class="c" style="animation-delay:4.8s">$</tspan>
      <tspan class="c" style="animation-delay:4.84s"> </tspan>
      <tspan class="c" style="animation-delay:4.88s">n</tspan>
      <tspan class="c" style="animation-delay:4.92s">m</tspan>
      <tspan class="c" style="animation-delay:4.96s">a</tspan>
      <tspan class="c" style="animation-delay:5s">p</tspan>
      <tspan class="c" style="animation-delay:5.04s"> </tspan>
      <tspan class="c" style="animation-delay:5.08s">c</tspan>
      <tspan class="c" style="animation-delay:5.12s">o</tspan>
      <tspan class="c" style="animation-delay:5.16s">n</tspan>
      <tspan class="c" style="animation-delay:5.2s">t</tspan>
      <tspan class="c" style="animation-delay:5.24s">r</tspan>
      <tspan class="c" style="animation-delay:5.28s">i</tspan>
      <tspan class="c" style="animation-delay:5.32s">b</tspan>
      <tspan class="c" style="animation-delay:5.36s">s</tspan>
    </text>

    <!-- netbird / cline line -->
    <text x="100" y="208" fill="#0f0" font-weight="600" filter="url(#g)">
      <tspan class="c" style="animation-delay:5.8s" fill="#ff0">n</tspan>
      <tspan class="c" style="animation-delay:5.84s" fill="#ff0">e</tspan>
      <tspan class="c" style="animation-delay:5.88s" fill="#ff0">t</tspan>
      <tspan class="c" style="animation-delay:5.92s" fill="#ff0">b</tspan>
      <tspan class="c" style="animation-delay:5.96s" fill="#ff0">i</tspan>
      <tspan class="c" style="animation-delay:6s" fill="#ff0">r</tspan>
      <tspan class="c" style="animation-delay:6.04s" fill="#ff0">d</tspan>
      <tspan class="c" style="animation-delay:6.08s"> </tspan>
      <tspan class="c" style="animation-delay:6.12s" fill="#f93">2</tspan>
      <tspan class="c" style="animation-delay:6.16s" fill="#f93">7</tspan>
      <tspan class="c" style="animation-delay:6.2s" fill="#f93">K</tspan>
      <tspan class="c" style="animation-delay:6.24s" fill="#f93">★</tspan>
      <tspan class="c" style="animation-delay:6.28s" fill="#555"> </tspan>
      <tspan class="c" style="animation-delay:6.32s" fill="#555">·</tspan>
      <tspan class="c" style="animation-delay:6.36s" fill="#555"> </tspan>
      <tspan class="c" style="animation-delay:6.4s" fill="#ff0">c</tspan>
      <tspan class="c" style="animation-delay:6.44s" fill="#ff0">l</tspan>
      <tspan class="c" style="animation-delay:6.48s" fill="#ff0">i</tspan>
      <tspan class="c" style="animation-delay:6.52s" fill="#ff0">n</tspan>
      <tspan class="c" style="animation-delay:6.56s" fill="#ff0">e</tspan>
      <tspan class="c" style="animation-delay:6.6s"> </tspan>
      <tspan class="c" style="animation-delay:6.64s" fill="#f93">6</tspan>
      <tspan class="c" style="animation-delay:6.68s" fill="#f93">4</tspan>
      <tspan class="c" style="animation-delay:6.72s" fill="#f93">K</tspan>
      <tspan class="c" style="animation-delay:6.76s" fill="#f93">★</tspan>
    </text>

    <!-- cursor -->
    <rect x="456" y="194" width="12" height="18" fill="#0f0" class="B" filter="url(#g)"/>

    <!-- final prompt -->
    <text x="80" y="236" fill="#0f0" class="c" style="animation-delay:7.2s" filter="url(#g)">
      $ ./get-hired █
    </text>

  </g>

</svg>
