<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="auto">
  <defs>

    <linearGradient id="phosphor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="100%" stop-color="#008f11"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff41">
        <animate attributeName="stop-color" values="#00ff41;#39ff14;#0f0;#00ff41" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#008f11">
        <animate attributeName="stop-color" values="#008f11;#39ff14;#00ff41;#008f11" dur="2s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0,0,0,0.35)"/>
    </pattern>

    <pattern id="noise" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" x="10" y="12" fill="#00ff41" opacity="0.03"/>
      <rect width="1" height="1" x="30" y="44" fill="#00ff41" opacity="0.04"/>
      <rect width="2" height="1" x="50" y="22" fill="#00ff41" opacity="0.03"/>
      <rect width="1" height="2" x="18" y="58" fill="#00ff41" opacity="0.04"/>
      <rect width="1" height="1" x="42" y="8"  fill="#00ff41" opacity="0.03"/>
      <rect width="3" height="1" x="6"  y="36" fill="#00ff41" opacity="0.02"/>
      <rect width="1" height="1" x="55" y="52" fill="#00ff41" opacity="0.04"/>
      <rect width="2" height="2" x="28" y="32" fill="#00ff41" opacity="0.03"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softglow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      @keyframes pop { from{opacity:0;filter:blur(2px)} to{opacity:1;filter:blur(0)} }
      @keyframes fadeUp { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:translateY(0)} }
      @keyframes blink { 0%,100%{opacity:1} 45%{opacity:1} 50%{opacity:0.04} 55%{opacity:1} }
      @keyframes flicker { 0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:0.7} 94%{opacity:1} 96%{opacity:0.6} 97%{opacity:1} }
      @keyframes pulse { 0%,100%{opacity:0.05} 50%{opacity:0.12} }
      @keyframes scanline { 0%{transform:translateY(-100%)} 100%{transform:translateY(100%)} }
      @keyframes glitch1 { 0%,100%{transform:translate(0)} 2%{transform:translate(-2px,1px)} 4%{transform:translate(2px,-1px)} 6%{transform:translate(0)} }
      @keyframes glitch2 { 0%,100%{transform:translate(0)} 1.5%{transform:translate(2px,0)} 3%{transform:translate(-1px,-1px)} 4.5%{transform:translate(0)} }
      .p  { animation: pop 0.04s both ease-out; }
      .fu { animation: fadeUp 0.6s both ease-out; }
      .bl { animation: blink 1s infinite; }
      .fk { animation: flicker 8s infinite; }
      .bp { animation: pulse 3s ease-in-out infinite; }
      .g1 { animation: glitch1 7s infinite; }
      .g2 { animation: glitch2 5s infinite; }
      .sl { animation: scanline 0.1s linear infinite; }
      .mn { font-family: 'SF Mono','Fira Code','Cascadia Code',monospace; }
    </style>
  </defs>

  <!-- pure black background -->
  <rect width="1000" height="300" fill="#000000"/>

  <!-- CRT noise texture -->
  <rect width="1000" height="300" fill="url(#noise)"/>

  <!-- background hex / code fragments - brighter green -->
  <g font-family="'SF Mono',monospace" font-size="12" fill="#00ff41" class="bp" opacity="0.08">
    <text x="20"  y="35"  style="animation-delay:0s">  0x7f3a  PUSH  EAX | PUSH  ECX | XOR  EDX,EDX</text>
    <text x="380" y="65"  style="animation-delay:0.4s">  struct sockaddr_in { sin_family=AF_INET sin_port=htons(443) }</text>
    <text x="100" y="280" style="animation-delay:0.8s">  nmap -sV -p 1-65535 --script=vuln 10.0.0.0/24</text>
    <text x="520" y="260" style="animation-delay:1.2s">  tcpdump -i eth0 -A 'tcp port 443 and (tcp[((tcp[12:1]&amp;0xf0)&gt;&gt;2):4]=0x47455420)'</text>
    <text x="50"  y="155" style="animation-delay:1.6s">  payload = base64.b64decode(sys.argv[1]); exec(zlib.decompress(payload))</text>
    <text x="620" y="45"  style="animation-delay:2s">  SELECT user,password FROM mysql.user WHERE host='%'</text>
    <text x="700" y="130" style="animation-delay:2.4s">  ssh -D 1080 -C -N -f user@jumpbox.internal</text>
  </g>

  <!-- floating hex / symbols -->
  <g font-family="'SF Mono',monospace" font-size="18" fill="#00ff41" class="bp" opacity="0.1">
    <text x="25"  y="110" style="animation-delay:0s">|</text>
    <text x="940" y="200" style="animation-delay:0.6s">&amp;</text>
    <text x="70"  y="240" style="animation-delay:1.2s">$</text>
    <text x="905" y="80"  style="animation-delay:1.8s">#</text>
    <text x="920" y="270" style="animation-delay:2.4s">&gt;</text>
  </g>

  <!-- IP fragments floating -->
  <g font-family="'SF Mono',monospace" font-size="13" fill="#00ff41" class="bp" opacity="0.07">
    <text x="40"  y="170" style="animation-delay:0.3s">192.168.1.105:22</text>
    <text x="780" y="90"  style="animation-delay:1s">10.0.3.4:3000</text>
    <text x="680" y="275" style="animation-delay:1.7s">::1:8080</text>
  </g>

  <!-- terminal window - classic green border -->
  <rect x="50" y="18" width="900" height="264" rx="6" fill="#000a00" stroke="#00cc33" stroke-width="1.5"/>
  <rect x="50" y="18" width="900" height="264" rx="6" fill="url(#scan)"/>

  <!-- scanline ray -->
  <rect x="50" y="0" width="900" height="2" fill="#00ff41" opacity="0.04" class="sl"/>

  <!-- title bar -->
  <rect x="50" y="18" width="900" height="30" rx="6" fill="#001a00"/>
  <rect x="50" y="33" width="900" height="15" fill="#001a00"/>
  <circle cx="69" cy="33" r="5.5" fill="#ff3333"/>
  <circle cx="87" cy="33" r="5.5" fill="#ffcc00"/>
  <circle cx="105" cy="33" r="5.5" fill="#00ff41"/>
  <text x="500" y="38" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11.5" fill="#00cc33" font-weight="600">root@kali:~# ./connect.sh</text>
  <line x1="50" y1="48" x2="950" y2="48" stroke="#003300" stroke-width="1"/>

  <g class="mn">

    <!-- $ whoami -->
    <text x="85" y="78" fill="#00ff41" font-size="15" filter="url(#softglow)">
      <tspan class="p" style="animation-delay:0.20s">$</tspan>
      <tspan class="p" style="animation-delay:0.24s"> </tspan>
      <tspan class="p" style="animation-delay:0.28s">w</tspan>
      <tspan class="p" style="animation-delay:0.32s">h</tspan>
      <tspan class="p" style="animation-delay:0.36s">o</tspan>
      <tspan class="p" style="animation-delay:0.40s">a</tspan>
      <tspan class="p" style="animation-delay:0.44s">m</tspan>
      <tspan class="p" style="animation-delay:0.48s">i</tspan>
    </text>

    <!-- name - glitchy -->
    <text x="105" y="106" fill="#00ff41" font-size="15" font-weight="700" filter="url(#glow)" class="g1">
      <tspan class="p" style="animation-delay:1.00s">s</tspan>
      <tspan class="p" style="animation-delay:1.04s">u</tspan>
      <tspan class="p" style="animation-delay:1.08s">f</tspan>
      <tspan class="p" style="animation-delay:1.12s">i</tspan>
      <tspan class="p" style="animation-delay:1.16s">y</tspan>
      <tspan class="p" style="animation-delay:1.20s">a</tspan>
      <tspan class="p" style="animation-delay:1.24s">n</tspan>
      <tspan class="p" style="animation-delay:1.28s" fill="#39ff14">-</tspan>
      <tspan class="p" style="animation-delay:1.32s" fill="#39ff14">k</tspan>
      <tspan class="p" style="animation-delay:1.36s" fill="#39ff14">h</tspan>
      <tspan class="p" style="animation-delay:1.40s" fill="#39ff14">a</tspan>
      <tspan class="p" style="animation-delay:1.44s" fill="#39ff14">n</tspan>
    </text>

    <!-- $ cat ROLE -->
    <text x="85" y="136" fill="#00ff41" font-size="15" filter="url(#softglow)">
      <tspan class="p" style="animation-delay:1.90s">$</tspan>
      <tspan class="p" style="animation-delay:1.94s"> </tspan>
      <tspan class="p" style="animation-delay:1.98s">c</tspan>
      <tspan class="p" style="animation-delay:2.02s">a</tspan>
      <tspan class="p" style="animation-delay:2.06s">t</tspan>
      <tspan class="p" style="animation-delay:2.10s"> </tspan>
      <tspan class="p" style="animation-delay:2.14s">R</tspan>
      <tspan class="p" style="animation-delay:2.18s">O</tspan>
      <tspan class="p" style="animation-delay:2.22s">L</tspan>
      <tspan class="p" style="animation-delay:2.26s">E</tspan>
    </text>

    <!-- role response -->
    <text x="105" y="162" fill="#39ff14" font-size="15" class="fu" style="animation-delay:2.60s" filter="url(#glow)">
      Senior Software Engineer · Backend · AI Infrastructure
    </text>

    <!-- $ nmap --open-source -->
    <text x="85" y="193" fill="#00ff41" font-size="15" filter="url(#softglow)">
      <tspan class="p" style="animation-delay:3.20s">$</tspan>
      <tspan class="p" style="animation-delay:3.24s"> </tspan>
      <tspan class="p" style="animation-delay:3.28s">n</tspan>
      <tspan class="p" style="animation-delay:3.32s">m</tspan>
      <tspan class="p" style="animation-delay:3.36s">a</tspan>
      <tspan class="p" style="animation-delay:3.40s">p</tspan>
      <tspan class="p" style="animation-delay:3.44s"> </tspan>
      <tspan class="p" style="animation-delay:3.48s">o</tspan>
      <tspan class="p" style="animation-delay:3.52s">p</tspan>
      <tspan class="p" style="animation-delay:3.56s">e</tspan>
      <tspan class="p" style="animation-delay:3.60s">n</tspan>
      <tspan class="p" style="animation-delay:3.64s">-</tspan>
      <tspan class="p" style="animation-delay:3.68s">s</tspan>
      <tspan class="p" style="animation-delay:3.72s">o</tspan>
      <tspan class="p" style="animation-delay:3.76s">u</tspan>
      <tspan class="p" style="animation-delay:3.80s">r</tspan>
      <tspan class="p" style="animation-delay:3.84s">c</tspan>
      <tspan class="p" style="animation-delay:3.88s">e</tspan>
    </text>

    <!-- response - glitchy -->
    <text x="105" y="221" fill="#39ff14" font-size="15" class="fu g2" style="animation-delay:4.40s" filter="url(#glow)">
      <tspan>netbird </tspan><tspan fill="#ffcc00">27K+★</tspan><tspan>  cline </tspan><tspan fill="#ffcc00">64K+★</tspan>
    </text>

    <!-- block cursor -->
    <rect x="474" y="206" width="10" height="18" fill="#00ff41" class="bl" filter="url(#glow)"/>

    <!-- last prompt -->
    <text x="85" y="253" fill="#00ff41" font-size="15" class="fu" style="animation-delay:5.30s" filter="url(#softglow)">
      $ ./get-hired █
    </text>

  </g>
</svg>
